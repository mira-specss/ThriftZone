version: '3.8'

services:
  app:
    restart: always
    build: .
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=thriftzone_db
      - DB_USER=thrift_user
      - DB_PASS=Rahasia123!

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_DB=thriftzone_db
      - POSTGRES_USER=thrift_user
      - POSTGRES_PASSWORD=Rahasia123!
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d

volumes:
  db_data:
